<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thư viện đề IELTS</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header class="flex items-center justify-between px-5 h-14">
    <div class="flex items-center gap-3">
      <div class="font-semibold text-xl tracking-tight cursor-pointer" style="color:var(--acc)" onclick="openLib()">IELTS</div>
      <div class="text-sm"><div id="who" class="font-medium"></div><div style="color:var(--mute)"><span id="badge"></span> · Computer-delivered</div></div>
    </div>
    <div class="flex items-center gap-2">
      <span id="clock" class="text-2xl font-semibold tabular-nums" style="min-width:5.5rem;text-align:center">--:--</span>
      <button class="btn" id="tg" title="Ẩn/hiện đồng hồ">Ẩn giờ</button>
    </div>
    <div class="flex items-center gap-2">
      <button class="btn" id="homeBtn">Trang chủ</button>
      <button class="btn" id="theme">Sáng/Tối</button>
      <button class="btn" id="set">Thư viện đề</button>
      <a class="btn" href="writing.html" style="text-decoration:none">Chấm Writing</a>
      <button class="btn pri" id="sub">Nộp bài</button>
    </div>
  </header>
  <main class="flex flex-1 min-h-0">
    <section id="left" class="pane w-1/2" style="border-right:1px solid var(--line)"></section>

    <section class="w-1/2 flex flex-col min-h-0" style="background:var(--bg)">
      <div class="navp">
        <div class="flex items-center justify-between mb-2"><b id="prog" class="text-sm"></b>
          <span class="flex gap-3"><span class="leg"><i style="background:var(--ok)"></i>Đã trả lời</span><span class="leg"><i style="background:var(--bgs)"></i>Chưa trả lời</span><span class="leg"><i style="background:var(--flag)"></i>Xem lại</span></span></div>
        <div id="nav" class="flex flex-wrap gap-1.5"></div>
        <div class="flex items-center gap-2 mt-3"><button class="btn" id="prev">‹ Trước</button><button class="btn" id="next">Sau ›</button><span class="text-xs ml-2" style="color:var(--mute)">Alt+← / Alt+→ chuyển câu · Alt+F đánh dấu</span></div>
      </div>
      <div id="qs" class="flex-1 overflow-auto p-4"></div>
    </section>
  </main>
</div>
<div id="tb"><button data-a="y"><i class="dot" style="background:#ffe45c"></i>Vàng</button><button data-a="g"><i class="dot" style="background:#6fdc8c"></i>Xanh</button><button data-a="n">Add Note</button><button data-a="c">Xóa highlight</button></div>
<div id="np"><textarea id="nt" rows="4" placeholder="Ghi chú của bạn..."></textarea><div class="flex justify-between mt-2"><button class="btn" id="ndel">Xóa</button><button class="btn pri" id="nclose">Xong</button></div></div>
<div id="dlg"></div>

<script src="tests.js" charset="utf-8"></script>
<script src="app.js"></script>
</body>
</html>
